server:
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catchandgo}
    username: ${SPRING_DATASOURCE_USERNAME:catchandgo}
    password: ${SPRING_DATASOURCE_PASSWORD:catchandgo}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    table: flyway_schema_history_auth
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDISHOST:${REDIS_HOST:localhost}}}
      port: ${SPRING_DATA_REDIS_PORT:${REDISPORT:${REDIS_PORT:6379}}}
      password: ${REDISPASSWORD:${REDIS_PASSWORD:}}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /auth/v3/api-docs
  swagger-ui:
    path: /auth/swagger-ui.html
  servers:
    - url: https://api-gateway2-catch-go.up.railway.app
      description: API Gateway (Producción)

