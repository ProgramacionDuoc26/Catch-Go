server:
  port: ${PORT:${SERVER_PORT:8085}}

spring:
  application:
    name: notification-service
  data:
    redis:
      host: ${REDISHOST:${REDIS_HOST:localhost}}
      port: ${REDISPORT:${REDIS_PORT:6379}}
      password: ${REDISPASSWORD:${REDIS_PASSWORD:}}
      timeout: 5000ms
      connect-timeout: 5000ms

logging:
  level:
    com.catchandgo: INFO

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

app:
  messaging:
    streams:
      job-applications: "stream:job-applications"
      notifications: "stream:notifications"
      dlq: "stream:job-applications:dlq"
    groups:
      notifications-group: "notifications-group"
    consumer:
      name: "notification-consumer-1"
      poll-timeout-ms: 2000
      batch-size: 10
    retry:
      max-attempts: 3

